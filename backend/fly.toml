# fly.toml app configuration file generated for family-wallet-backend on 2026-03-28T20:02:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'family-wallet-backend'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
