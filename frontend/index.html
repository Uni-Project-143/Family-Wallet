<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Family Wallet — Shared Family Budget</title>
    <meta
      name="description"
      content="Family Wallet — shared family budgeting: a unified Monobank transaction feed, connected cards, and Secret Gift collective gifting with surprise isolation."
    />
    <meta name="theme-color" content="#0d0c0a" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        /* overflow-x: hidden прибирає випадковий горизонтальний скрол,
           але дозволяє вертикальний — інакше на мобільному контент обрізається */
        overflow-x: hidden;
      }
      #app {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
