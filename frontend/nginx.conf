server {
    listen 80;
    resolver 8.8.8.8;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend "family-wallet-backend.fly.dev";
        proxy_pass https://$backend/;
        proxy_set_header Host $backend;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
